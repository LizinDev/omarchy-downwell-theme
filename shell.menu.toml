background-alpha          = 1.0
text                      = "#e9e9e9"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#000000"
scrim-alpha               = 0.6
selected-background       = "#f90000"
selected-background-alpha = 0.14
selected-text             = "#f90000"
selected-border           = "#f90000"
selected-border-alpha     = 1.0
selected-border-width     = 2
